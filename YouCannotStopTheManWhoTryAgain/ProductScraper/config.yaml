# ── Product Scraper configuration ─────────────────────────────────────────

# Resume mode: reuses state.json + products_cache.json so an interrupted run
# continues where it left off. Set to false to start a brand-new scrape.
resume: true

scraper:
  # Which scraper implementation to use. Registered names live in
  # app/infrastructure/scrapers/.
  name: salla

  # Category pages to start from. The scraper will visit each one, click the
  # "load more" button and collect every product link it finds.
  category_urls:
    - https://salla.sa/fahadshopksa/%D8%AD%D9%82%D8%A7%D8%A6%D8%A8-%D8%B4%D8%A7%D9%86%D9%8A%D9%84/c339003983

  # Hard cap on how many products are scraped per run (0 = unlimited).
  max_products: 230

  # Playwright browser settings used by client-rendered storefronts (salla).
  browser:
    channel: chrome              # use the installed Google Chrome
    headless: true
    locale: ar-SA
    viewport_width: 1366
    viewport_height: 900
    navigation_timeout: 60000    # ms per page load
    action_timeout: 15000        # ms per DOM action / wait
    wait_after_load_ms: 4000     # settle time after domcontentloaded
    retries: 3
    retry_backoff: 1.0

http:
  user_agent: "ProductScraper/1.0 (desktop e-commerce importer)"
  timeout: 30                  # seconds per request
  verify_ssl: true
  headers: {}
  retries: 3                   # retry count for transient failures
  retry_backoff: 1.0           # initial wait between retries (seconds)
  max_retry_delay: 30.0        # maximum wait between retries (seconds)

download:
  threads: 8                   # concurrent image downloads (ThreadPoolExecutor)
  timeout: 60                  # seconds per image request
  retries: 3
  max_images_per_product: 30   # gallery safety cap

output:
  directory: output
  images_dir: output/images    # output/images/<Product Name>_<SKU>/main.jpg + gallery_XX.jpg
  excel_file: output/products.xlsx
  state_file: output/state.json
  products_cache: output/products_cache.json
  log_file: output/scraper.log

logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

ui:
  show_progress: true          # tqdm progress bars
